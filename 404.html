<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Ownexis</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400;1,700&family=Carlito:wght@400;700&display=swap">
<link rel="stylesheet" href="/assets/css/styles.css">
<meta name="theme-color" content="#202028">
<style>
  .notfound { min-height: 100vh; display: grid; place-items: center; background: var(--ink); color: var(--cream); text-align: center; }
  .notfound__inner { max-width: 34rem; padding: var(--gutter); }
  .notfound img { height: 34px; width: auto; margin: 0 auto 2.5rem; }
  .notfound h1 { font-size: clamp(1.75rem, 1.3rem + 2vw, 2.5rem); color: #fff; }
  .notfound p { margin-top: 1.25rem; color: var(--muted-light); }
  .notfound .btn { margin-top: 2.25rem; }
</style>
</head>
<body>
<main class="notfound">
  <div class="notfound__inner">
    <img src="/assets/img/logo-horizontal-light.png" alt="Ownexis">
    <h1>That page isn't here</h1>
    <p>The link may be out of date. Head back to the homepage, or write to us and we'll point you to what you were looking for.</p>
    <p lang="es">Esta página no existe. Vuelva al inicio o escríbanos y le indicamos lo que buscaba.</p>
    <a class="btn btn--light" href="/">Back to homepage</a>
  </div>
</main>
</body>
</html>
